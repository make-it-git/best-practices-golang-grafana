global:
  scrape_interval: 1s

scrape_configs:
  - job_name: "go-app"
    static_configs:
      - targets: ["go-app-1:8080", "go-app-2:8080"]
        labels:
          node: 'my-single-node'

  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          node: 'my-single-node'

